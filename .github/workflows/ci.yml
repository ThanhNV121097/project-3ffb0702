name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: code/backend/go.sum
      - name: Build backend
        run: cd code/backend && go build ./...
      - name: Vet backend
        run: cd code/backend && go vet ./...
      - name: Test backend
        run: cd code/backend && go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd code/frontend && npm ci
      - name: Lint frontend
        run: cd code/frontend && npm run lint
      - name: Build frontend
        run: cd code/frontend && npm run build
      - name: Test frontend
        run: cd code/frontend && npm test --if-present

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config -q

  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject hardcoded CSS colors and token fallbacks
        run: |
          if grep -rnE '#[0-9a-fA-F]{3,8}\b|var\(--[a-z0-9-]+,' --include='*.module.css' code/frontend; then
            echo 'hardcoded colour or token fallback — use var(--token) and define the token in globals.css'
            exit 1
          fi
